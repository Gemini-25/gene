<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gene viewer</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --accent2: #eb6834;
  --btn: #f0efec; --btn-on: #2a78d6; --btn-on-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent2: #d95926;
    --btn: #2c2c2a; --btn-on: #3987e5; --btn-on-ink: #0b0b0b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent2: #d95926;
  --btn: #2c2c2a; --btn-on: #3987e5; --btn-on-ink: #0b0b0b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px;
  border-bottom: 1px solid var(--border); background: var(--surface); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.meta { color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-left: auto; }
button { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; min-height: 28px; }
button.on { background: var(--btn-on); color: var(--btn-on-ink); border-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { display: flex; height: calc(100% - 46px); min-height: 0; }
#mapwrap { flex: 1; position: relative; min-width: 0; background: var(--page); }
#map { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#maphint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
aside { width: 380px; overflow-y: auto; border-left: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }
h2 { font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.tile .k { color: var(--muted); font-size: 11px; }
.tile .v { font-size: 18px; font-weight: 600; }
canvas.chart { width: 100%; height: 120px; display: block; }
.census { list-style: none; padding: 0; margin: 0; }
.census li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center;
  padding: 4px 6px; border-radius: 6px; cursor: pointer; }
.census li:hover, .census li.sel { background: var(--btn); }
.sw { width: 12px; height: 12px; border-radius: 3px; }
.small { color: var(--muted); font-size: 11px; }
pre { font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--page);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow-x: auto; white-space: pre; margin: 6px 0; }
table.kv { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.kv td { padding: 2px 0; border-bottom: 1px solid var(--grid); }
table.kv td:first-child { color: var(--muted); width: 44%; }
.empty { color: var(--muted); }
@media (max-width: 820px) {
  main { flex-direction: column; height: auto; }
  #mapwrap { height: 60vh; }
  aside { width: 100%; border-left: 0; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>
<header>
  <h1>Gene</h1>
  <span class="meta" id="meta">connecting…</span>
  <div class="controls">
    <button id="play" title="Space">▶ 재생</button>
    <button id="step" title="→">한 tick</button>
    <button id="step100">100 tick</button>
    <span class="small">속도</span>
    <button data-tps="10">1x</button>
    <button data-tps="50">5x</button>
    <button data-tps="500">50x</button>
    <button data-tps="5000">500x</button>
    <button data-tps="0">MAX</button>
    <button id="save">저장</button>
    <button id="sig" title="M1 신호 장 표시">신호</button>
    <button id="theme" title="자동 / 밝게 / 어둡게">테마: 자동</button>
  </div>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="maphint">휠: 확대 · 끌기: 이동 · 클릭: 개체 선택</div>
  </div>
  <aside>
    <div class="tiles">
      <div class="tile"><div class="k">개체</div><div class="v" id="t-pop">–</div></div>
      <div class="tile"><div class="k">출생 (이번 세션)</div><div class="v" id="t-births">–</div></div>
      <div class="tile"><div class="k">사망 (이번 세션)</div><div class="v" id="t-deaths">–</div></div>
      <div class="tile"><div class="k">고유 genome</div><div class="v" id="t-genomes">–</div></div>
      <div class="tile"><div class="k">TPS</div><div class="v" id="t-tps">–</div></div>
      <div class="tile"><div class="k">빛</div><div class="v" id="t-light">–</div></div>
    </div>
    <h2>개체 수</h2>
    <canvas class="chart" id="c-pop"></canvas>
    <h2>고유 genome 수</h2>
    <canvas class="chart" id="c-gen"></canvas>
    <h2>많은 genome <span class="small" id="g-distinct"></span></h2>
    <ul class="census" id="census"></ul>
    <h2>선택한 개체</h2>
    <div id="agent" class="empty">지도에서 개체를 클릭하세요.</div>
  </aside>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let state = null, hist = null, terrain = null, water = null, W = 0, H = 0;
let selected = 0, highlight = null, showSignal = false;
let view = { scale: 1, ox: 0, oy: 0, fitted: false };
const base = document.createElement("canvas");
const map = $("map"), ctx = map.getContext("2d");

async function getJSON(p) { const r = await fetch(p, { cache: "no-store" }); return r.json(); }
async function getBin(p) { const r = await fetch(p, { cache: "no-store" }); return new Uint8Array(await r.arrayBuffer()); }
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(1) + "K" : String(n);
const hexColor = (c) => "#" + c.toString(16).padStart(6, "0");

// ---------------- map
function rebuildBase() {
  if (!terrain) return;
  base.width = W; base.height = H;
  const bctx = base.getContext("2d");
  const img = bctx.createImageData(W, H);
  const dark = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light"
    || document.documentElement.dataset.theme === "dark";
  for (let t = 0; t < W * H; t++) {
    const e = terrain[8 + 2 * t] / 15;
    let g = dark ? 26 + 70 * e : 150 + 90 * e;
    let r = g * 0.97, gg = g * 0.95, b = g * 0.88;
    if (water) {
      const wv = water[t];
      if (wv === 255) { r = 140; gg = 95; b = 60; }
      else {
        const f = Math.min(1, wv / 64);
        r = r * (1 - 0.65 * f); gg = gg * (1 - 0.35 * f); b = b * (1 - f) + (dark ? 150 : 205) * f;
      }
    }
    img.data[4 * t] = r; img.data[4 * t + 1] = gg; img.data[4 * t + 2] = b; img.data[4 * t + 3] = 255;
  }
  bctx.putImageData(img, 0, 0);
}

function fit() {
  const r = map.getBoundingClientRect();
  view.scale = Math.min(r.width / W, r.height / H) * 0.98;
  view.ox = (r.width - W * view.scale) / 2;
  view.oy = (r.height - H * view.scale) / 2;
  view.fitted = true;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const r = map.getBoundingClientRect();
  if (map.width !== Math.round(r.width * dpr) || map.height !== Math.round(r.height * dpr)) {
    map.width = Math.round(r.width * dpr); map.height = Math.round(r.height * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--page");
  ctx.fillRect(0, 0, r.width, r.height);
  if (!state || !terrain) return;
  if (!view.fitted) fit();
  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.scale, view.scale);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(base, 0, 0);
  // night: the world is darker when light is low
  ctx.fillStyle = `rgba(5,10,40,${(0.45 * (1 - state.light)).toFixed(3)})`;
  ctx.fillRect(0, 0, W, H);
  if (showSignal && state.signal && state.signal.length) {
    const sg = state.signal;
    for (let k = 0; k < sg.length; k += 3) {
      const t = sg[k], v = sg[k + 2];
      const x = t % W, y = Math.floor(t / W);
      const al = Math.min(0.85, Math.abs(v) / 200);
      ctx.fillStyle = v > 0 ? `rgba(255,190,40,${al})` : `rgba(120,200,255,${al})`;
      ctx.fillRect(x - 0.5, y - 0.5, 2, 2);
    }
  }
  if (state.parcels && state.parcels.length) {
    // stride 6: tile, volume, compression, east bond, south bond, flags (1 anchored, 2 gripped)
    const pc = state.parcels;
    for (let k = 0; k < pc.length; k += 6) {
      const t = pc[k], s = pc[k + 1], c = pc[k + 2];
      const x = t % W, y = Math.floor(t / W);
      const blocks = s >= 16 && c >= 128;
      const shade = Math.round(blocks ? 70 : 200 - Math.min(120, c / 2));
      ctx.fillStyle = `rgb(${shade},${shade - 10},${shade - 25})`;
      const inset = blocks ? 0 : 0.18;
      ctx.fillRect(x + inset, y + inset, 1 - 2 * inset, 1 - 2 * inset);
    }
    if (view.scale >= 4) {
      ctx.strokeStyle = "rgba(235,104,52,0.9)";
      for (let k = 0; k < pc.length; k += 6) {
        const t = pc[k], be = pc[k + 3], bs = pc[k + 4], f = pc[k + 5];
        const x = t % W + 0.5, y = Math.floor(t / W) + 0.5;
        for (const [b, dx, dy] of [[be, 1, 0], [bs, 0, 1]]) {
          if (!b) continue;
          ctx.lineWidth = 0.08 + 0.3 * Math.min(1, b / 64);
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
        }
        if (f & 1) { // anchor: a small square at the centre
          ctx.fillStyle = "rgba(40,40,40,0.9)";
          ctx.fillRect(x - 0.12, y - 0.12, 0.24, 0.24);
        }
        if (f & 2) { // grip: outline
          ctx.lineWidth = 0.1;
          ctx.strokeRect(x - 0.42, y - 0.42, 0.84, 0.84);
        }
      }
    }
  }
  const a = state.agents, n = a.uid.length;
  const s = view.scale;
  const size = s >= 3 ? 1 : Math.min(3, 2 / s);
  const off = (1 - size) / 2;
  for (let i = 0; i < n; i++) {
    const c = a.c[i];
    if (highlight !== null && c !== highlight) {
      ctx.fillStyle = "rgba(160,160,160,0.55)";
    } else {
      ctx.fillStyle = hexColor(c);
    }
    ctx.fillRect(a.x[i] + off, a.y[i] + off, size, size);
    if (s >= 8 && a.emb[i] > 0) {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(a.x[i] + 0.38, a.y[i] + 0.38, 0.24, 0.24);
    }
  }
  if (selected) {
    const i = a.uid.indexOf(selected);
    if (i >= 0) {
      ctx.lineWidth = 2 / s;
      ctx.strokeStyle = css("--ink");
      ctx.beginPath();
      ctx.arc(a.x[i] + 0.5, a.y[i] + 0.5, Math.max(2.5, 6 / s), 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

let drag = null;
map.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy, moved: false }; map.setPointerCapture(e.pointerId); });
map.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  view.ox = drag.ox + dx; view.oy = drag.oy + dy; draw();
});
map.addEventListener("pointerup", (e) => {
  const d = drag; drag = null;
  if (!d || d.moved || !state) return;
  const r = map.getBoundingClientRect();
  const wx = (e.clientX - r.left - view.ox) / view.scale, wy = (e.clientY - r.top - view.oy) / view.scale;
  const a = state.agents;
  let best = -1, bd = Math.max(3, 8 / view.scale) ** 2;
  for (let i = 0; i < a.uid.length; i++) {
    const d2 = (a.x[i] + 0.5 - wx) ** 2 + (a.y[i] + 0.5 - wy) ** 2;
    if (d2 < bd) { bd = d2; best = i; }
  }
  selected = best >= 0 ? a.uid[best] : 0;
  loadAgent(); draw();
});
map.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = map.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(64, Math.max(0.2, view.scale * k));
  view.ox = mx - (mx - view.ox) * (ns / view.scale);
  view.oy = my - (my - view.oy) * (ns / view.scale);
  view.scale = ns; draw();
}, { passive: false });
map.addEventListener("dblclick", () => { view.fitted = false; draw(); });
window.addEventListener("resize", () => { view.fitted = false; draw(); drawCharts(); });

// ---------------- charts (one series each, one axis, hover readout)
const hover = {};
function lineChart(canvas, xs, ys, color, label) {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const c = canvas.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = css("--surface"); c.fillRect(0, 0, r.width, r.height);
  if (!xs || xs.length < 2) return;
  const L = 40, R = 8, T = 8, B = 20, pw = r.width - L - R, ph = r.height - T - B;
  const xmax = xs[xs.length - 1], xmin = xs[0];
  let ymax = Math.max(1, ...ys);
  const mag = 10 ** Math.floor(Math.log10(ymax)); ymax = Math.ceil(ymax / mag) * mag;
  const X = (v) => L + pw * (v - xmin) / Math.max(1, xmax - xmin), Y = (v) => T + ph * (1 - v / ymax);
  c.font = "11px system-ui, sans-serif"; c.fillStyle = css("--muted"); c.strokeStyle = css("--grid"); c.lineWidth = 1;
  for (const f of [0, 0.5, 1]) {
    const v = ymax * f, y = Math.round(Y(v)) + 0.5;
    c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke();
    c.textAlign = "right"; c.fillText(fmt(Math.round(v)), L - 6, y + 4);
  }
  c.textAlign = "left"; c.fillText("day " + (xmin / 4096).toFixed(0), L, r.height - 4);
  c.textAlign = "right"; c.fillText("day " + (xmax / 4096).toFixed(1), L + pw, r.height - 4);
  c.strokeStyle = color; c.lineWidth = 2; c.lineJoin = "round"; c.lineCap = "round";
  c.beginPath();
  for (let i = 0; i < xs.length; i++) { const x = X(xs[i]), y = Y(ys[i]); i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  const h = hover[canvas.id];
  if (h !== undefined) {
    let i = 0, bd = Infinity;
    for (let k = 0; k < xs.length; k++) { const d = Math.abs(X(xs[k]) - h); if (d < bd) { bd = d; i = k; } }
    const x = X(xs[i]), y = Y(ys[i]);
    c.strokeStyle = css("--axis"); c.lineWidth = 1; c.beginPath(); c.moveTo(x, T); c.lineTo(x, T + ph); c.stroke();
    c.fillStyle = color; c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fill();
    c.strokeStyle = css("--surface"); c.lineWidth = 2; c.stroke();
    const txt = `day ${(xs[i] / 4096).toFixed(1)} · ${label} ${ys[i]}`;
    c.font = "12px system-ui, sans-serif"; const tw = c.measureText(txt).width;
    const bx = Math.min(Math.max(L, x - tw / 2 - 6), L + pw - tw - 12);
    c.fillStyle = css("--page"); c.fillRect(bx, T, tw + 12, 18);
    c.fillStyle = css("--ink"); c.textAlign = "left"; c.fillText(txt, bx + 6, T + 13);
  }
}
function drawCharts() {
  if (!hist || !hist.tick) return;
  lineChart($("c-pop"), hist.tick, hist.pop, css("--accent"), "개체");
  lineChart($("c-gen"), hist.tick, hist.genomes, css("--accent"), "genome");
}
for (const id of ["c-pop", "c-gen"]) {
  const el = $(id);
  el.addEventListener("pointermove", (e) => { hover[id] = e.clientX - el.getBoundingClientRect().left; drawCharts(); });
  el.addEventListener("pointerleave", () => { delete hover[id]; drawCharts(); });
}

// ---------------- panels
function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
const EMB = ["없음", "기록 중", "변이 기록", "형식 오류", "준비됨"];
async function loadAgent() {
  const el = $("agent");
  if (!selected) { el.className = "empty"; el.textContent = "지도에서 개체를 클릭하세요."; return; }
  const a = await getJSON("/api/agent?uid=" + selected);
  if (a.error) { el.className = "empty"; el.textContent = `#${selected}: 이미 죽었어요.`; selected = 0; draw(); return; }
  el.className = "";
  const inv = Object.entries(a.inv).map(([k, v]) => `${k} ${v}`).join(", ") || "비어 있음";
  const emb = a.embryo ? `${EMB[a.embryo.state]} · ${a.embryo.raw_len}/${a.embryo.capacity} cell · energy ${a.embryo.energy}` : "없음";
  el.innerHTML = `<table class="kv">
    <tr><td>개체</td><td>#${a.uid} (부모 #${a.parent}, 조상 #${a.root})</td></tr>
    <tr><td>세대 · 나이</td><td>${a.generation} · ${a.age} tick (${(a.age / 4096).toFixed(2)}일)</td></tr>
    <tr><td>위치 · 방향</td><td>(${a.x}, ${a.y}) · ${"북동남서"[a.orient]}</td></tr>
    <tr><td>가용 energy</td><td>${a.energy} q (광합성 credit ${a.photo_credit})</td></tr>
    <tr><td>몸체 · inventory</td><td>G${a.body_g} S${a.shell_s} · ${esc(inv)}</td></tr>
    <tr><td>유지비</td><td>${a.upkeep} q/tick</td></tr>
    <tr><td>배아</td><td>${emb}</td></tr>
    <tr><td>자식</td><td>${a.children}</td></tr>
    <tr><td>초안 · 학습 코드</td><td>${a.draft ? `${a.draft.len}/${a.draft.capacity} cell${a.draft.foreign ? " (공개 기록 포함)" : ""}` : "없음"} · ${a.learned ? `${a.learned.len} cell 채택${a.learned.foreign ? " (공개 기록 출처)" : ""}` : "없음"}${a.retained ? ` · 보존 ${a.retained}` : ""}</td></tr>
    <tr><td>tile</td><td>θ ${a.theta} · 최대광 ${a.tile_light_peak} · 고도 ${a.tile_elev} · 물 ${a.tile_water}</td></tr>
    <tr><td>genome</td><td>${a.genome} · ${a.cells} cell · ${a.pages} 페이지</td></tr>
    <tr><td>VM</td><td>module ${a.pc[0]} pc ${a.pc[1]} · fault ${a.fault}</td></tr>
  </table>
  <div class="small" style="margin-top:6px">레지스터 r0..r15</div><pre>${a.regs.join(" ")}</pre>
  <div class="small">작업 기억 [0..31]</div><pre>${a.mem.join(" ")}</pre>
  <div class="small">조상과의 명령어 차이 (상속 코드)</div><pre>${esc(a.diff)}</pre>
  ${a.learned ? `<div class="small">조상과의 명령어 차이 (학습 코드)</div><pre>${esc(a.learned.diff)}</pre>` : ""}`;
}
async function loadCensus() {
  const g = await getJSON("/api/genomes");
  if (!g.top) return;
  $("g-distinct").textContent = `(고유 ${g.distinct}개)`;
  const ul = $("census"); ul.innerHTML = "";
  for (const t of g.top) {
    const li = document.createElement("li");
    if (highlight === t.color) li.className = "sel";
    li.innerHTML = `<span class="sw" style="background:${hexColor(t.color)}"></span>
      <span>${t.hash} <span class="small">· ${t.cells} cell · 최대 ${t.max_gen}세대 · 계통 ${t.lineages}</span></span>
      <span>${t.count}</span>`;
    li.title = t.diff;
    li.onclick = () => { highlight = highlight === t.color ? null : t.color; loadCensus(); draw(); };
    ul.appendChild(li);
  }
}

// ---------------- controls
async function control(q) { await fetch("/api/control?" + q); poll(); }
$("play").onclick = () => control(state && state.paused ? "play=1" : "pause=1");
$("step").onclick = () => control("step=1");
$("sig").onclick = () => { showSignal = !showSignal; $("sig").classList.toggle("on", showSignal); draw(); };
$("step100").onclick = () => control("step=100");
$("save").onclick = async () => { const r = await getJSON("/api/save"); alert(r.saved ? "저장: " + r.saved : "실패: " + r.error); };
for (const b of document.querySelectorAll("button[data-tps]")) b.onclick = () => control("tps=" + b.dataset.tps);
const THEMES = ["auto", "light", "dark"], THEME_NAMES = { auto: "자동", light: "밝게", dark: "어둡게" };
function applyTheme(t) {
  if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $("theme").textContent = "테마: " + THEME_NAMES[t];
  rebuildBase(); draw(); drawCharts();
}
let theme = "auto";
try { theme = localStorage.getItem("gene-theme") || "auto"; } catch {}
const urlTheme = new URLSearchParams(location.search).get("theme");
if (THEMES.includes(urlTheme)) theme = urlTheme;
$("theme").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  try { localStorage.setItem("gene-theme", theme); } catch {}
  applyTheme(theme);
};
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.code === "ArrowRight") $("step").click();
});

// ---------------- polling
async function poll() {
  try {
    state = await getJSON("/api/state");
  } catch { $("meta").textContent = "연결 끊김"; return; }
  if (!state.tick && state.tick !== 0) return;
  W = state.w; H = state.h;
  const clock = Math.floor((((state.tick + 2048) % 4096) / 4096) * 24);
  $("meta").textContent = `seed ${state.seed} · ${state.ruleset} · tick ${state.tick.toLocaleString()} · ${state.day}일째 ${String(clock).padStart(2, "0")}시`;
  $("t-pop").textContent = fmt(state.pop);
  $("t-births").textContent = fmt(state.births);
  $("t-deaths").textContent = fmt(state.deaths);
  $("t-genomes").textContent = fmt(state.genomes);
  $("t-tps").textContent = state.paused ? "정지" : Math.round(state.tps);
  $("t-light").textContent = Math.round(state.light * 100) + "%";
  $("play").textContent = state.paused ? "▶ 재생" : "⏸ 정지";
  $("play").classList.toggle("on", !state.paused);
  for (const b of document.querySelectorAll("button[data-tps]")) b.classList.toggle("on", Number(b.dataset.tps) === state.speed);
  draw();
}
async function slowPoll() {
  try {
    hist = await getJSON("/api/history"); drawCharts();
    water = await getBin("/api/water"); rebuildBase(); draw();
  } catch {}
}
async function start() {
  await poll();
  terrain = await getBin("/api/terrain");
  await slowPoll();
  loadCensus();
  setInterval(() => { if (!document.hidden) poll(); }, 250);
  setInterval(() => { if (!document.hidden) slowPoll(); }, 3000);
  setInterval(() => { if (!document.hidden) { loadCensus(); if (selected) loadAgent(); } }, 4000);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { rebuildBase(); draw(); drawCharts(); });
applyTheme(theme);
start();
</script>
